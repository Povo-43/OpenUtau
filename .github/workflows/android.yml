name: Android Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .NET 10 SDK (OpenUtau は net10.0 対象)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Android SDK のセットアップ (GitHub Actions ランナー標準の Android SDK を使用)
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/lib/android-sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/lib/android-sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME:-/usr/lib/android-sdk}/ndk" >> "$GITHUB_ENV"
          # Android SDK platform 36 と build-tools をインストール
          yes | "${ANDROID_HOME:-/usr/lib/android-sdk}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            2>&1 || true

      # Android ビルド用ワークロードをインストール
      - name: Install Android workload
        run: dotnet workload install android

      # 依存関係の復元 (Android ターゲット)
      - name: Restore (Android)
        run: dotnet restore OpenUtau.Android/OpenUtau.Android.csproj

      # Android プロジェクトのビルド + APK 生成 (arm64)
      # GitHub Actions ランナーでファイルロック競合 (MSB3554) を回避するため
      # 事前に obj/bin をクリーンしてからビルド
      - name: Build (Android arm64)
        run: |
          find . -type d \( -name obj -o -name bin \) -exec rm -rf {} + 2>/dev/null || true
          dotnet publish OpenUtau.Android/OpenUtau.Android.csproj -c Release -f net10.0-android36.0 -p:AndroidTargetArch=arm64 -p:AndroidPackageFormat=apk -p:AndroidSignMode=Debug -p:UseSharedCompilation=false

      # APK をアーティファクトとしてアップロード (リリース用)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Android.apk
          path: |
            OpenUtau.Android/bin/Release/net10.0-android36.0/publish/*.apk


