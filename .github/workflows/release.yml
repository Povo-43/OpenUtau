name: Android Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # .NET 10 SDK (OpenUtau は net10.0 対象)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Android SDK のセットアップ (GitHub Actions ランナー標準の Android SDK を使用)
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/lib/android-sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/lib/android-sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME:-/usr/lib/android-sdk}/ndk" >> "$GITHUB_ENV"
          # Android SDK platform 36 と build-tools をインストール
          yes | "${ANDROID_HOME:-/usr/lib/android-sdk}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            2>&1 || true

      # Android ビルド用ワークロードをインストール
      - name: Install Android workload
        run: dotnet workload install android

      # 依存関係の復元 (Android ターゲット)
      - name: Restore (Android)
        run: dotnet restore OpenUtau.Android/OpenUtau.Android.csproj

      # リリース署名用キーストアを Secrets から復元
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > /tmp/openutau-release.keystore
          echo "KEYSTORE_PATH=/tmp/openutau-release.keystore" >> "$GITHUB_ENV"

      # APK 生成 (arm64, リリース署名済み)
      - name: Build APK (Android arm64)
        run: |
          find . -type d \( -name obj -o -name bin \) -exec rm -rf {} + 2>/dev/null || true
          dotnet publish OpenUtau.Android/OpenUtau.Android.csproj -c Release -f net10.0-android36.0 -p:AndroidTargetArch=arm64 -p:AndroidPackageFormat=apk -p:AndroidSignMode=ApkKeyStore -p:AndroidSigningKeyStore="${{ env.KEYSTORE_PATH }}" -p:AndroidSigningKeyStorePassword="${{ secrets.KEYSTORE_PASSWORD }}" -p:AndroidSigningKeyAlias="${{ secrets.KEY_ALIAS }}" -p:AndroidSigningKeyPassword="${{ secrets.KEY_PASSWORD }}" -p:UseSharedCompilation=false -p:BuildInParallel=false

      # バージョン文字列をタグから取得
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # APK をリネームしてアップロード
      - name: Prepare APK artifact
        run: |
          mkdir -p release
          cp OpenUtau.Android/bin/Release/net10.0-android36.0/publish/com.stakira.openutau-Signed.apk release/OpenUtau-Android-${{ steps.version.outputs.version }}.apk

      # 7z 圧縮ツールをインストール (帯域が細い環境向け)
      - name: Install 7z
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      # APK を 7z で圧縮 (帯域が細い環境向け)
      - name: Compress APK to 7z
        run: |
          cd release
          7z a -t7z -m0=lzma2 -mx=9 OpenUtau-Android-${{ steps.version.outputs.version }}.7z OpenUtau-Android-${{ steps.version.outputs.version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Android-release.apk
          path: release/*.apk

      - name: Upload APK 7z artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Android-release.7z
          path: release/*.7z

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenUtau-Android-release.apk
          path: release

      - name: Download APK 7z artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenUtau-Android-release.7z
          path: release

      - name: Create Release and upload APK + zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: OpenUtau Android ${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
